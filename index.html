<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Our Little World — Hadiah Ulang Tahun</title>
    <meta name="description" content="Sebuah kamar kecil, buku kenangan, dan petualangan ulang tahun." />
    <link rel="stylesheet" href="css/style.css?v=1.3" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐧</text></svg>"
    />
  </head>
  <body>
    <!-- ============ Intro pembuka ============ -->
    <div id="intro" class="intro">
      <div class="intro-inner">
        <div class="intro-hati" aria-hidden="true">♡</div>
        <h1 class="judul-pembuka">A little room, just for you.</h1>
        <p class="intro-teks" data-isi="ucapanPembuka"></p>
        <p class="intro-kecil">
          Untuk <strong data-isi="namaPacar"></strong> — dari <strong data-isi="namaSaya"></strong>, di hari
          <strong data-isi="tanggalUlangTahun"></strong>.
        </p>
        <button id="intro-mulai" class="btn btn-utama btn-besar">💌 Masuk ke kamarmu</button>
        <p id="intro-status" class="intro-status" role="status">Menyiapkan kamarmu…</p>
        <p class="intro-tip">Tips: geser untuk melihat-lihat kamar, lalu ketuk objek yang berkedip.</p>
      </div>
    </div>

    <!-- ============ Kamar 3D ============ -->
    <main id="room-root" class="room-root" aria-label="Kamar 3D interaktif"></main>

    <!-- Layer label objek (di atas kanvas 3D) -->
    <div id="label-layer" class="label-layer" aria-hidden="false"></div>

    <!-- ============ HUD atas ============ -->
    <header class="hud hud-atas">
      <div class="hud-judul">
        <span class="hud-logo" aria-hidden="true">🐧</span>
        <div>
          <strong>Little Room</strong>
          <small>untuk <span data-isi="namaPacar"></span></small>
        </div>
      </div>
      <div class="hud-kanan">
        <button id="music-btn" class="btn btn-tipis" aria-pressed="false" aria-label="Putar atau jeda musik">
          ▶ Musik
        </button>
        <input id="music-volume" class="volume" type="range" min="0" max="100" value="35" aria-label="Volume musik" />
      </div>
    </header>

    <!-- ============ Navigasi cepat (aksesibilitas) ============ -->
    <nav class="hud nav-cepat" aria-label="Navigasi cepat">
      <button class="btn btn-tipis" data-pergi="buku">📖 Scrapbook</button>
      <button class="btn btn-tipis" data-pergi="pc">🎮 Birthday Quest</button>
      <button class="btn btn-tipis" data-pergi="penguin">🐧 Pinguin</button>
      <button class="btn btn-tipis" data-pergi="hadiah">🎁 Hadiah</button>
      <button class="btn btn-tipis" data-pergi="kue">🎂 Kue</button>
    </nav>

    <!-- ============ Layer fitur (buku, PC, modal) ============ -->
    <div id="layer-root" class="layer-root"></div>

    <!-- ============ Toast ============ -->
    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <!-- ============ Tombol kembali (muncul saat mendekat ke objek) ============ -->
    <button id="back-room" class="btn btn-soft back-room" type="button">← Kembali ke kamar</button>

    <script src="vendor/three.min.js?v=1"></script>
    <script src="js/config.js?v=1.1"></script>
    <script src="js/store.js?v=1"></script>
    <script src="js/audio.js?v=1.1"></script>
    <script src="js/room.js?v=1.8"></script>
    <script src="js/scrapbook.js?v=1.3"></script>
    <script src="js/game.js?v=1.4"></script>
    <script src="js/app.js?v=1.4"></script>
  </body>
</html>
